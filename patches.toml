# Config file for recompiling the Hybrid Heaven (USA) patches.
#
# Structure mirrors Goemon64Recomp/patches.toml. Unlike hybridheaven.toml,
# which has to read the decomp ELF directly (see the README on cross-section
# relocs), this one CAN use the .syms.toml files: they are only consulted to
# resolve the patch's references to game symbols by name, and the patch's own
# relocations live in patches/build/patches.elf.
#
# Build patches/build/patches.elf first:
#   make -C patches

[input]
# Paths are relative to the location of this config file.
elf_path = "patches/build/patches.elf"
output_func_path = "RecompiledPatches"
single_file_output = true
# Allow absolute symbols to be used as jump targets. The host exports in
# patches/syms.ld are absolute symbols in the 0x8F000000 manual-patch range.
use_absolute_symbols = true
# Point the recompiler at the symbol files so that it can resolve relocations
# during recompilation.
func_reference_syms_file = "HybridHeaven-RecompSyms/hybridheaven.syms.toml"
data_reference_syms_files = [ "HybridHeaven-RecompSyms/hybridheaven.datasyms.toml" ]
# Tell the recompiler to write the output binary. Doing this instead of using
# objcopy allows the recompiler to patch MIPS32 relocs.
output_binary_path = "patches/patches.bin"
# Do not emit warnings for unpaired LO16 values, as clang produces many of them.
unpaired_lo16_warnings = false
# Allow exporting functions and events for mods to use.
allow_exports = true
# Enable strict patch mode, validates that patched symbols exist and that
# non-patch functions aren't symbols.
strict_patch_mode = true
